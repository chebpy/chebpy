[tool.bumpversion]
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:[-]?(?P<release>[a-z]+)[\\.]?(?P<pre_n>\\d+))?(?:\\+build\\.(?P<build_n>\\d+))?"
serialize = ["{major}.{minor}.{patch}-{release}.{pre_n}+build.{build_n}", "{major}.{minor}.{patch}+build.{build_n}", "{major}.{minor}.{patch}-{release}.{pre_n}", "{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Chore: bump version {current_version} → {new_version}"
commit_args = ""
pre_commit_hooks = ["uv sync", "git add uv.lock"] # Ensure uv.lock is updated

[tool.bumpversion.parts.release]
optional_value = "prod"
values = [
    "dev",
    "alpha",
    "a",  # PEP 440 short form for alpha
    "beta",
    "b",  # PEP 440 short form for beta
    "rc",
    "prod"
]

# Anchored to the [project] table on purpose. `search`/`replace` are applied to
# EVERY occurrence in the file, so the obvious `version = "{current_version}"`
# also rewrites any [tool.*] table that happens to share the current number.
# Dependency pins (httpx>=1.2.0, rich==1.2.0) are never at risk either way —
# they are not line-anchored `version = ` assignments — but a second table is.
[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '(?ms)^\[project\]((?:(?!^\[)[\s\S])*?)^version = "{current_version}"'
replace = '[project]\1version = "{new_version}"'

# NOTE for downstream projects: do NOT add a glob over your own
# .github/workflows/*.yml here. Those stubs pin jebel-quant/rhiza's version
# (the template you sync from), not your project's, so rewriting them with your
# version would point them at a rhiza tag that does not exist. The template ref
# is managed by /rhiza:update via .rhiza/template.yml instead.

# Keep the reusable-workflow stubs in the bundles pinned to the current release.
# These stubs are synced into downstream repos and must reference an existing tag.
# The search is a regex anchored to the `jebel-quant/rhiza/...` path so it rewrites
# the pin from ANY prior version (not just {current_version}) — this prevents silent
# drift if a stub was left behind — while leaving third-party action pins
# (actions/checkout@vX, astral-sh/setup-uv@vX, ...) in the same files untouched.
# This block ships verbatim in the synced downstream .cfg.toml; there it is a
# harmless no-op because a downstream repo has no bundles/ tree (the glob matches
# nothing and bump-my-version skips it).
[[tool.bumpversion.files]]
glob = "bundles/**/.github/workflows/*.yml"
regex = true
search = "(jebel-quant/rhiza/[^@\\s]+)@v\\d+\\.\\d+\\.\\d+"
replace = "\\1@v{new_version}"
ignore_missing_version = true
