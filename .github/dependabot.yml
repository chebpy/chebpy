# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Configuration: Dependabot
#
# Purpose: Automate updates of the Python dependencies in pyproject.toml / uv.lock.
#
# Only the uv ecosystem is configured on purpose. Everything else with a version pin in
# this repo (GitHub Actions in the rhiza_*.yml workflows, pre-commit hooks, ...) is
# template-owned: rhiza bumps those pins upstream and they arrive through rhiza sync.
# A Dependabot bump here would edit a file the next sync overwrites, and the
# check-managed-files hook rejects it.
#
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies using uv
  - package-ecosystem: "uv"
    directory: "/"
    # Bump uv.lock only; leave pyproject.toml ranges alone unless a new version falls
    # outside them. Without this, Dependabot's default ("auto") treats any project it
    # cannot find on PyPI -- private, unpublished, or whose name belongs to another
    # project -- as an application and rewrites every `>=` floor to the latest version,
    # which then fails the lowest-direct-dependency CI job.
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Dubai"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
