# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Configuration: Dependabot
#
# Purpose: Automate dependency updates for Python packages, GitHub Actions, and Docker images.
#
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies using uv
  - package-ecosystem: "uv"
    directory: "/"
    # Bump uv.lock only; leave pyproject.toml ranges alone unless a new version falls
    # outside them. Without this, Dependabot's default ("auto") treats any project it
    # cannot find on PyPI -- private, unpublished, or whose name belongs to another
    # project -- as an application and rewrites every `>=` floor to the latest version,
    # which then fails the lowest-direct-dependency CI job.
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Dubai"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Dubai"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

    commit-message:
      prefix: "chore(deps)"
      include: "scope"

