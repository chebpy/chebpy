# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Workflow: Weekly
#
# Purpose: Runs checks that are too slow or noisy for every push:
#   dep-compat-test — resolves dependencies fresh (ignoring the lockfile) and
#                     runs the full test suite to catch newly-released packages
#                     that break compatibility before Renovate picks them up.
#   link-check      — verifies all hyperlinks in README.md are reachable.
#
# Trigger: Weekly schedule (Monday 08:00 UTC) and manual dispatch.

name: "(RHIZA) WEEKLY"

permissions:
  contents: read

on:
  #push:
  #  branches: [main]
  #  paths: [README.md]
  #pull_request:
  #  paths: [README.md]
  schedule:
    - cron: "0 8 * * 1"  # Every Monday at 08:00 UTC
  workflow_dispatch:

jobs:
  weekly:
    uses: jebel-quant/rhiza/.github/workflows/rhiza_weekly.yml@v1.11.0
    # Forwarded explicitly: `secrets: inherit` only reaches a reusable workflow in the
    # caller's own organisation or enterprise (#1689). A secret this repository has not
    # defined arrives empty and the workflow falls back to `github.token`.
    secrets:
      RHIZA_SETUP_CREDENTIALS: ${{ secrets.RHIZA_SETUP_CREDENTIALS }}
      GH_PAT: ${{ secrets.GH_PAT }}
      UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
